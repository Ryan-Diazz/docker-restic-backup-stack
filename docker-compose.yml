services:
  # ==================
  # Appflowy
  # ==================
  backup-appflowy-postgres:
    image: ghcr.io/ryan-diazz/postgres-backup:latest
    environment:
      TZ: ${TZ}
      SERVICE: appflowy
      CRON_SCHEDULE: ${APPFLOWY_POSTGRES_CRON}
      POSTGRES_HOST: ${APPFLOWY_POSTGRES_HOST}
      POSTGRES_DB: ${APPFLOWY_POSTGRES_DB}
      POSTGRES_USER: ${APPFLOWY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${APPFLOWY_POSTGRES_PASSWORD}
    volumes:
      - ./staging/appflowy/postgres:/backup
    restart: unless-stopped
    networks:
      - appflowy_cloud_default

  # ==================
  # Overleaf
  # ==================
  backup-overleaf-mongo:
    image: ghcr.io/ryan-diazz/mongo-backup:latest
    environment:
      SERVICE: overleaf
      TZ: ${TZ}
      CRON_SCHEDULE: ${OVERLEAF_MONGO_CRON}
      MONGO_HOST: ${OVERLEAF_MONGO_HOST}
    volumes:
      - ./staging/overleaf/mongo:/backup
    restart: unless-stopped
    networks:
      - overleaf_overleaf-net

  # ==================
  # Restic
  # ==================
  backup-restic:
    image: ghcr.io/ryan-diazz/restic-backup:latest
    environment:
      TZ: ${TZ}
      CRON_SCHEDULE: ${RESTIC_CRON}
      CHECK_CRON_SCHEDULE: ${RESTIC_CRON_CHECK:-"0 4 * * 0"}
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
    volumes:
      - ./staging:/staging:ro
      - ${STACKS_PATH:?STACKS_PATH is not set in .env}:/data:ro
      - ${NAS_BACKUP_PATH:?NAS_BACKUP_PATH is not set in .env}:/repository
      - ./restore:/restore
      - ./scripts:/scripts
    restart: unless-stopped
networks:
  appflowy_cloud_default:
    external: true
  overleaf_overleaf-net:
    external: true
